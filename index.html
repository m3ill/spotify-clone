<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spotify • Müziğin burada</title><link rel="stylesheet" href="styles.css?v=20261107-catalog"></head>
<body><header class="topbar"><button class="brand" aria-label="Spotify ana sayfa" data-action="home"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="currentColor"/><g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M7 11q10-4 19 2M8 16q9-3 16 2M9 21q7-2 13 1"/></g></svg></button><div class="search-group"><button class="home circle" aria-label="Ana sayfa" data-action="home"></button><div class="searchbox"><span id="search-icon"></span><input id="search" placeholder="Ne çalmak istiyorsun?" aria-label="Şarkı, sanatçı veya çalma listesi ara" autocomplete="off"><button id="clear-search" aria-label="Aramayı temizle" hidden>×</button><span class="search-divider"></span><button id="browse" aria-label="Türlere göz at"></button></div></div><div class="account"><span class="local-label">Senin müziğin. Senin dünyan.</span><button id="notifications" aria-label="Bildirimler"></button><button class="avatar" aria-label="Kullanıcı profili">D</button></div></header>
<div class="workspace"><aside class="library panel"><div class="library-title"><h2><span id="library-icon"></span> Kitaplığın</h2><button id="create" aria-label="Çalma listesi oluştur" class="pill create">＋ <span>Oluştur</span></button></div><div class="library-filters"><button class="pill selected" data-library="playlists">Çalma listeleri</button><button class="pill" data-library="artists">Sanatçılar</button><button class="pill" data-library="albums">Albümler</button></div><div class="library-tools"><button id="library-search-toggle" aria-label="Kitaplıkta ara"></button><input id="library-search" aria-label="Kitaplığı filtrele" placeholder="Kitaplığında ara" hidden><button id="sort">Son çalınanlar <span>☷</span></button></div><nav id="library-list" aria-label="Kitaplık"></nav><div class="library-footer"><span class="status-dot"></span> Müzikle biraz daha sen.</div></aside>
<main id="main" class="panel"><div class="filters" id="filters"></div><div id="content"></div></main>
<aside class="now-panel panel" id="now-panel"><div class="now-heading"><strong id="context-title">Şimdi çalan</strong><button id="close-now" aria-label="Şimdi çalan panelini kapat">×</button></div><div id="now-content"></div></aside></div>
<footer class="player"><div id="current-track" class="current-track"></div><div class="transport"><div class="transport-buttons"><button id="shuffle" aria-label="Karışık çal" aria-pressed="false"></button><button id="previous" aria-label="Önceki şarkı"></button><button id="play" class="play-main" aria-label="Çal"></button><button id="next" aria-label="Sonraki şarkı"></button><button id="repeat" aria-label="Tekrarla" aria-pressed="false"></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="214" value="0" aria-label="Şarkı ilerlemesi"><span id="duration">3:34</span></div></div><div class="player-extras"><button id="queue" aria-label="Sıradaki şarkılar"></button><button id="toggle-now" aria-label="Şimdi çalan paneli" aria-pressed="true"></button><button id="mute" aria-label="Sesi kapat"></button><input id="volume" type="range" min="0" max="100" value="65" aria-label="Ses seviyesi"><button id="fullscreen" aria-label="Tam ekran"></button></div></footer>
<div id="toast" role="status"></div><dialog id="create-dialog"><form id="create-form"><h2>Yeni çalma listesi</h2><label for="playlist-name">Liste adı</label><input id="playlist-name" maxlength="60" placeholder="Bir isim ver" required><div><button type="button" id="cancel-create" class="pill">Vazgeç</button><button class="green-button">Oluştur</button></div></form></dialog><script src="data.js"></script><script src="app.js?v=20261107-playlists"></script><script src="playlist-ui.js?v=20261107-playlists"></script><script src="account-service.js?v=20261107-playlists"></script><script src="account.js?v=20261107-playlists"></script><script src="community.js"></script><script src="songs-ui.js?v=20261107-catalog"></script></body></html>
